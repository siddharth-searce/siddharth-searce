<svg xmlns="http://www.w3.org/2000/svg" width="850" height="64" viewBox="0 0 850 64" role="img" aria-label="telemetry console">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00FF41"/>
      <stop offset="1" stop-color="#B44CFF"/>
    </linearGradient>
    <style>
      .mono{font-family:'Courier New',Courier,monospace;}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .blink{animation:blink 1s step-end infinite;}
      @keyframes dash{to{stroke-dashoffset:-440;}}
      .stream{stroke-dasharray:8 10;animation:dash 6s linear infinite;}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      .pulse{animation:pulse 2.2s ease-in-out infinite;}
    </style>
  </defs>
  <rect width="850" height="64" fill="#050A0F"/>
  <path d="M10 64V30L40 12H810L840 30V64" fill="#07131B"/>
  <path d="M10 64V30L40 12H810L840 30V64" fill="none" stroke="url(#cg)" stroke-width="1.6"/>
  <path d="M10 64V30L40 12H810L840 30V64" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.5" class="stream"/>
  <path d="M10 46V30L24 21" fill="none" stroke="#00FF41" stroke-width="3"/>
  <path d="M826 21L840 30V46" fill="none" stroke="#00FF41" stroke-width="3"/>
  <circle cx="52" cy="40" r="5" fill="#FF3B3B" class="blink"/>
  <text x="66" y="45" class="mono" font-size="14" letter-spacing="3" fill="url(#cg)" font-weight="bold">TELEMETRY.CONSOLE — LIVE FEED</text>
  <text x="820" y="45" text-anchor="end" class="mono pulse" font-size="12" letter-spacing="2" fill="#00FF41">SIGNAL: LIVE ⌁</text>
  <text x="425" y="45" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#00F0FF" opacity="0.7">[ INSTRUMENT 01 // ISOMETRIC CONTRIBUTION FIELD ]</text>
</svg>
