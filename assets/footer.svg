<svg xmlns="http://www.w3.org/2000/svg" width="850" height="100" viewBox="0 0 850 100" role="img" aria-label="end of transmission">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00FF41"/>
      <stop offset="1" stop-color="#B44CFF"/>
    </linearGradient>
    <style>
      .mono{font-family:'Courier New',Courier,monospace;}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .blink{animation:blink 1.1s step-end infinite;}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .pulse{animation:pulse 2.6s ease-in-out infinite;}
      @keyframes dash{to{stroke-dashoffset:-320;}}
      .flow{stroke-dasharray:4 12;animation:dash 3.5s linear infinite;}
    </style>
  </defs>
  <rect width="850" height="100" fill="#050A0F"/>
  <line x1="20" y1="16" x2="830" y2="16" stroke="url(#fg)" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="16" x2="830" y2="16" stroke="#00F0FF" stroke-width="1" class="flow" opacity="0.7"/>
  <text x="425" y="52" text-anchor="middle" class="mono pulse" font-size="14" letter-spacing="6" fill="url(#fg)">— EOF · TRANSMISSION ENDS —</text>
  <text x="395" y="82" text-anchor="middle" class="mono" font-size="13" letter-spacing="2" fill="#00FF41">$ see_you_in_the_future</text>
  <rect x="512" y="70" width="9" height="14" fill="#00FF41" class="blink"/>
</svg>
