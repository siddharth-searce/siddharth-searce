<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240" role="img" aria-label="Siddharth Sancheti — AI-forward engineer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00FF41"/>
      <stop offset="1" stop-color="#B44CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00F0FF" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect x="10" y="10" width="830" height="220"/></clipPath>
    <style>
      .mono{font-family:'Courier New',Courier,monospace;}
      @keyframes scan{0%{transform:translateY(-6px)}100%{transform:translateY(240px)}}
      .scan{animation:scan 4.5s linear infinite;}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .blink{animation:blink 1.1s step-end infinite;}
      @keyframes dash{to{stroke-dashoffset:-560;}}
      .stream{stroke-dasharray:10 12;animation:dash 8s linear infinite;}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .pulse{animation:pulse 2.2s ease-in-out infinite;}
      @keyframes flicker{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}96%{opacity:.55}97%{opacity:1}}
      .flick{animation:flicker 6.5s linear infinite;}
    </style>
  </defs>

  <rect width="850" height="240" fill="#050A0F"/>
  <rect width="850" height="240" fill="url(#grid)"/>

  <rect x="10" y="10" width="830" height="220" fill="none" stroke="url(#neon)" stroke-width="1.4" opacity="0.9"/>
  <rect x="10" y="10" width="830" height="220" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.55" class="stream"/>

  <path d="M10 40V10H40" fill="none" stroke="#00FF41" stroke-width="3"/>
  <path d="M810 10H840V40" fill="none" stroke="#00FF41" stroke-width="3"/>
  <path d="M840 200V230H810" fill="none" stroke="#00FF41" stroke-width="3"/>
  <path d="M40 230H10V200" fill="none" stroke="#00FF41" stroke-width="3"/>

  <g clip-path="url(#frame)">
    <rect x="10" y="0" width="830" height="4" fill="#00F0FF" opacity="0.22" class="scan"/>
  </g>

  <text x="30" y="38" class="mono" font-size="12" letter-spacing="2" fill="#00F0FF" opacity="0.85">⌁ SYS.PROFILE // v3.0.26</text>
  <text x="820" y="38" text-anchor="end" class="mono pulse" font-size="12" letter-spacing="2" fill="#B44CFF">UPLINK: STABLE</text>

  <text x="425" y="118" text-anchor="middle" class="mono" font-size="44" font-weight="bold" letter-spacing="8" fill="url(#neon)" filter="url(#glow)">SIDDHARTH SANCHETI</text>
  <text x="425" y="152" text-anchor="middle" class="mono flick" font-size="15" letter-spacing="5" fill="#00FF41">// AI-FORWARD ENGINEER — FUTURIFYING WORK //</text>

  <line x1="30" y1="176" x2="820" y2="176" stroke="url(#neon)" stroke-width="0.6" opacity="0.5"/>

  <circle cx="42" cy="204" r="4" fill="#00FF41" class="blink"/>
  <text x="56" y="209" class="mono" font-size="13" letter-spacing="2" fill="#00FF41">SYSTEM ONLINE</text>
  <text x="280" y="209" class="mono" font-size="13" letter-spacing="2" fill="#00F0FF">AGENTS: ACTIVE</text>
  <text x="500" y="209" class="mono" font-size="13" letter-spacing="2" fill="#B44CFF">MODE: BUILD_THE_FUTURE</text>
  <rect x="796" y="196" width="10" height="16" fill="#00FF41" class="blink"/>
</svg>
