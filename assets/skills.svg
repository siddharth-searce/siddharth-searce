<svg xmlns="http://www.w3.org/2000/svg" width="850" height="470" viewBox="0 0 850 470" role="img" aria-label="Skill matrix">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#00FF41"/>
    </linearGradient>
    <linearGradient id="barAI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B44CFF"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00F0FF" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .mono{font-family:'Courier New',Courier,monospace;}
      .grow{transform-origin:300px 0;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards;}
      @keyframes grow{to{transform:scaleX(1);}}
      .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
      .d4{animation-delay:.6s}.d5{animation-delay:.75s}.d6{animation-delay:.9s}
      .d7{animation-delay:1.05s}.d8{animation-delay:1.2s}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .blink{animation:blink 1.1s step-end infinite;}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      .pulse{animation:pulse 2.4s ease-in-out infinite;}
      .fadein{opacity:0;animation:fadein .5s ease-out forwards;}
      @keyframes fadein{to{opacity:1;}}
      .f1{animation-delay:1.5s}.f2{animation-delay:1.65s}.f3{animation-delay:1.8s}
      .f4{animation-delay:1.95s}.f5{animation-delay:2.1s}.f6{animation-delay:2.25s}
      .f7{animation-delay:2.4s}.f8{animation-delay:2.55s}
    </style>
  </defs>

  <rect width="850" height="470" fill="#050A0F"/>
  <rect width="850" height="470" fill="url(#grid2)"/>
  <rect x="10" y="10" width="830" height="450" fill="none" stroke="#0E2A33" stroke-width="1.4"/>
  <path d="M10 34V10H34" fill="none" stroke="#00FF41" stroke-width="2.5"/>
  <path d="M816 10H840V34" fill="none" stroke="#00FF41" stroke-width="2.5"/>
  <path d="M840 436V460H816" fill="none" stroke="#00FF41" stroke-width="2.5"/>
  <path d="M34 460H10V436" fill="none" stroke="#00FF41" stroke-width="2.5"/>

  <text x="34" y="46" class="mono" font-size="14" letter-spacing="2" fill="#00FF41">$ ./skills --render --animated</text>
  <rect x="352" y="34" width="8" height="14" fill="#00FF41" class="blink"/>

  <text x="34" y="88" class="mono" font-size="13" letter-spacing="4" fill="#00F0FF">▞▞ LANGUAGES &amp; FRAMEWORKS</text>

  <text x="52" y="120" class="mono" font-size="14" fill="#C9D1D9">typescript / angular</text>
  <rect x="300" y="108" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="108" width="405" height="12" fill="url(#bar)" class="grow d1"/>
  <text x="756" y="119" class="mono fadein f1" font-size="13" fill="#00FF41">92%</text>

  <text x="52" y="152" class="mono" font-size="14" fill="#C9D1D9">python / django</text>
  <rect x="300" y="140" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="140" width="396" height="12" fill="url(#bar)" class="grow d2"/>
  <text x="756" y="151" class="mono fadein f2" font-size="13" fill="#00FF41">90%</text>

  <text x="52" y="184" class="mono" font-size="14" fill="#C9D1D9">dart / flutter</text>
  <rect x="300" y="172" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="172" width="330" height="12" fill="url(#bar)" class="grow d3"/>
  <text x="756" y="183" class="mono fadein f3" font-size="13" fill="#00FF41">75%</text>

  <text x="34" y="228" class="mono" font-size="13" letter-spacing="4" fill="#00F0FF">▞▞ CLOUD &amp; INFRA</text>

  <text x="52" y="260" class="mono" font-size="14" fill="#C9D1D9">gcp — gke / cloud run</text>
  <rect x="300" y="248" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="248" width="361" height="12" fill="url(#bar)" class="grow d4"/>
  <text x="756" y="259" class="mono fadein f4" font-size="13" fill="#00FF41">82%</text>

  <text x="52" y="292" class="mono" font-size="14" fill="#C9D1D9">terraform</text>
  <rect x="300" y="280" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="280" width="317" height="12" fill="url(#bar)" class="grow d5"/>
  <text x="756" y="291" class="mono fadein f5" font-size="13" fill="#00FF41">72%</text>

  <text x="52" y="324" class="mono" font-size="14" fill="#C9D1D9">postgresql / pub-sub</text>
  <rect x="300" y="312" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="312" width="352" height="12" fill="url(#bar)" class="grow d6"/>
  <text x="756" y="323" class="mono fadein f6" font-size="13" fill="#00FF41">80%</text>

  <text x="34" y="368" class="mono" font-size="13" letter-spacing="4" fill="#B44CFF">▞▞ AI TOOLING</text>

  <text x="52" y="400" class="mono" font-size="14" fill="#C9D1D9">claude code / ai agents</text>
  <rect x="300" y="388" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="388" width="422" height="12" fill="url(#barAI)" class="grow d7"/>
  <text x="756" y="399" class="mono fadein f7" font-size="13" fill="#B44CFF">96%</text>

  <text x="52" y="432" class="mono" font-size="14" fill="#C9D1D9">mcp / agentic workflows</text>
  <rect x="300" y="420" width="440" height="12" fill="#0C1820" stroke="#123240" stroke-width="1"/>
  <rect x="300" y="420" width="387" height="12" fill="url(#barAI)" class="grow d8"/>
  <text x="756" y="431" class="mono fadein f8" font-size="13" fill="#B44CFF">88%</text>

  <text x="820" y="452" text-anchor="end" class="mono pulse" font-size="11" letter-spacing="2" fill="#00F0FF">CALIBRATION: LIVE</text>
</svg>
