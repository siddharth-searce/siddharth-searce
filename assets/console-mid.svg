<svg xmlns="http://www.w3.org/2000/svg" width="850" height="34" viewBox="0 0 850 34" role="img" aria-label="console divider">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#00FF41"/>
      <stop offset="1" stop-color="#B44CFF" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .mono{font-family:'Courier New',Courier,monospace;}
      @keyframes dash{to{stroke-dashoffset:-320;}}
      .flow{stroke-dasharray:3 9;animation:dash 3s linear infinite;}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      .pulse{animation:pulse 2s ease-in-out infinite;}
    </style>
  </defs>
  <rect width="850" height="34" fill="#050A0F"/>
  <line x1="10" y1="0" x2="10" y2="34" stroke="#0E2A33" stroke-width="1.6"/>
  <line x1="840" y1="0" x2="840" y2="34" stroke="#0E2A33" stroke-width="1.6"/>
  <line x1="28" y1="17" x2="250" y2="17" stroke="url(#mg)" stroke-width="1.2"/>
  <line x1="600" y1="17" x2="822" y2="17" stroke="url(#mg)" stroke-width="1.2"/>
  <line x1="28" y1="17" x2="250" y2="17" stroke="#00F0FF" stroke-width="1" class="flow" opacity="0.35"/>
  <line x1="600" y1="17" x2="822" y2="17" stroke="#00F0FF" stroke-width="1" class="flow" opacity="0.35"/>
  <text x="425" y="21" text-anchor="middle" class="mono pulse" font-size="11" letter-spacing="2" fill="#00F0FF">[ INSTRUMENT 02 // CONTRIBUTION FEED — ORGANISM ACTIVE ]</text>
</svg>
